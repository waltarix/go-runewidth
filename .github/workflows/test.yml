name: Test

on: push

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1.25"

      - name: Test
        run: make test

      - name: Benchmark
        run: make bench
